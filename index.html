<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #121212;
    color: #ffffff;
    margin: 0;
    padding: 16px;
    font-family: sans-serif;
  }

  button {
    background-color: #2a2a2a;
    color: #ffffff;
    border: 1px solid #444;
    padding: 8px 16px;
    margin-right: 4px;
    cursor: pointer;
    border-radius: 4px;
  }

  button:hover {
    background-color: #3d3d3d;
  }

  iframe {
    border: none;
    background-color: #121212;
  }
</style>
</head>
<body>

<button onclick="show('overworld')">Overworld</button>
<button onclick="show('nether')">Nether</button>
<button onclick="show('end')">End</button>

<div id="overworld" class="tab">
    <iframe src="overworld/" width="100%" height="800"></iframe>
</div>

<div id="nether" class="tab" style="display:none;">
    <iframe src="nether/" width="100%" height="800"></iframe>
</div>

<div id="end" class="tab" style="display:none;">
    <iframe src="end/index.html" width="100%" height="800"></iframe>
</div>

<script>
function show(id) {
    document.querySelectorAll(".tab").forEach(t => t.style.display = "none");
    document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwordsEdge Atlas</title>

    <style>
        @font-face {
            font-family: 'Mojangles';
            src: url('Mojang-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --overworld-color: #55ff55;
            --nether-color: #ff5555;
            --end-color: #aa00aa;
        }

        body {
            
            background-image: url('dirt.png');
            background-repeat: repeat;
            background-size: 64px 64px;
            image-rendering: pixelated;
            margin: 0;
            padding: 24px;
            font-family: 'Mojangles', monospace;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            font-smooth: never;
            background-color: #000000;
            transition: background-image 0.2s ease-in-out;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mc-button {
            font-family: 'Mojangles', monospace;
            font-size: 16px;
            color: #e0e0e0;
          
            background-color: #2b2b2b;
            padding: 10px 20px;
            cursor: pointer;
         
            border: 4px solid #000000;
            outline: none;
            text-shadow: 2px 2px 0px #202020;
            transition: transform 0.05s ease, background-color 0.1s ease;
            user-select: none;
        }

            .mc-button:hover {
                color: #ffffff;
                background-color: #373737
            }

            .mc-button:active {
                transform: translateY(2px);
                background-color: #333333;
            }

        
            .mc-button[onclick*="overworld"].active,
            .mc-button[onclick*="overworld"]:hover {
                color: var(--overworld-color);
            }

            .mc-button[onclick*="nether"].active,
            .mc-button[onclick*="nether"]:hover {
                color: var(--nether-color);
            }

            .mc-button[onclick*="end"].active,
            .mc-button[onclick*="end"]:hover {
                color: var(--end-color);
            }

       
            .mc-button.active {
                background-color: #2b2b2b; 
            }

        .iframe-container {
            border: 4px solid #000000;
            box-shadow: 0 0 0 4px #373737;
            background-color: #000000;
        }

        iframe {
            border: none;
            display: block;
            background-color: #121212;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="mc-button active" onclick="show('overworld', this)">Overworld</button>
        <button class="mc-button" onclick="show('nether', this)">Nether</button>
        <button class="mc-button" onclick="show('end', this)">End</button>
    </div>

    <div class="iframe-container">
        <div id="overworld" class="tab">
            <iframe src="overworld/index.html" width="100%" height="800"></iframe>
        </div>

        <div id="nether" class="tab" style="display:none;">
            <iframe src="nether/index.html" width="100%" height="800"></iframe>
        </div>

        <div id="end" class="tab" style="display:none;">
            <iframe src="end/index.html" width="100%" height="800"></iframe>
        </div>
    </div>

    <script>
  
        const dimensionBackgrounds = {
            'overworld': "url('dirt.png')",
            'nether': "url('netherrack.png')",
            'end': "url('end_stone.png')"
        };

        function show(id, btnElement) {
       
            document.querySelectorAll(".tab").forEach(t => t.style.display = "none");

          
            document.getElementById(id).style.display = "block";

       
            document.querySelectorAll(".mc-button").forEach(b => b.classList.remove("active"));
            if (btnElement) {
                btnElement.classList.add("active");
            }

            if (dimensionBackgrounds[id]) {
                document.body.style.backgroundImage = dimensionBackgrounds[id];
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Bedrock Maps</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.tabs {
    background: #111;
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid #333;
}

button {
    background: #222;
    color: #fff;
    border: 1px solid #555;
    padding: 10px 20px;
    margin: 0 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

.tab {
    width: 100%;
    height: calc(100vh - 65px);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}
</style>

</head>
<body>

<div class="tabs">
    <button onclick="show('overworld')">Overworld</button>
    <button onclick="show('nether')">Nether</button>
    <button onclick="show('end')">End</button>
</div>

<div id="overworld" class="tab">
    <iframe src="overworld/"></iframe>
</div>

<div id="nether" class="tab" style="display:none;">
    <iframe src="nether/"></iframe>
</div>

<div id="end" class="tab" style="display:none;">
    <iframe src="end/"></iframe>
</div>

<script>
function show(id) {
    document.querySelectorAll(".tab").forEach(function(tab) {
        tab.style.display = "none";
    });
    document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>
